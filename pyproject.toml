[project]
name = "openhound-vault"
version = "0.1.0"
description = "HashiCorp Vault collector extension for OpenHound"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "VaultHound contributors" },
]
dependencies = [
    "dlt==1.26.0",
    "openhound>=0.4.0",
    "pydantic>=2.13.3,<3",
]

[project.urls]
Homepage = "https://github.com/bytewreck/VaultHound"
Repository = "https://github.com/bytewreck/VaultHound"

[project.entry-points."openhound.sources"]
vault = "openhound_vault.main:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhound_vault"]

[tool.hatch.build.targets.wheel.force-include]
"src/openhound_vault/extension.yaml" = "openhound_vault/extension.yaml"
"schema.json" = "openhound_vault/schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
